# Diffusion-side STEERING grid, run as a GPU worker POOL (cluster-agnostic template).
#
# One template serves every steering grid. `METHOD` selects the family and the two axes swept:
#   METHOD=tds_epi   family guidance,    algorithm tds   -- reward=epitope   -- axes: SCALES x CLIPS
#   METHOD=tds_cdr   family guidance,    algorithm tds   -- reward=cdr_rmsd  -- axes: SCALES x CLIPS
#   METHOD=svgd      STALE, see below. family interaction, algorithm svgd -- axes: SCALES x STEPSIZES
# One template rather than one per method ON PURPOSE: the preflight gate, the health gate, the
# distortion gate and the DockQ backfill are identical for all three, and three copies would drift.
#
# THE svgd, svgd_bw AND svgd_sn METHODS ARE STALE AND UNSUPPORTED. No reported result uses them and
# the algorithm is excluded from the paper. They are kept only because the transport path shares
# state with af3_red in models/protenix_hooks.py, so removing them is a sampler change rather than
# a deletion. See the note at DIFFUSION_FAMILIES in method/diffusion_side/diffusion_search.py.
#
# PARALLELISM = HOW MANY WORKERS YOU SUBMIT. Each worker job holds exactly ONE GPU and drains a
# shared PVC queue of ARMS (atomic `mkdir` claim), so N workers give ~N-way parallelism and the run
# finishes at ~total_arms/N with no straggler tail. Submit with jobs/submit_steer_pool.sh:
#
#   NGPUS=8 METHOD=tds_epi  jobs/submit_steer_pool.sh      # 8 GPUs draining the tds_epi grid
#
# WHY A POOL RATHER THAN FIXED SHARDS HERE. Steering arms have VERY uneven cost: an arm that tears
# structures or saturates its clip can run far longer or shorter than its neighbours, and cost is not
# predictable from the grid coordinates. A pool means a worker never idles while another
# finishes.
#
# WHY ONE ARM PER CLAIM. A worker claims a single (target, arm) unit, so a job killed mid-grid loses
# at most one arm, and the deadline only has to cover ONE arm rather than a whole row. Size
# DEADLINE_S to the scheduler's own maximum execution time and let UNIT_EST_S retire the worker
# cleanly (see jobs/submit_steer_pool.sh).
#
# RESTART / RE-SUBMIT is safe. Claims are atomic and completed arms retire to done/, so a resubmitted
# worker rejoins the pool, never double-runs an arm, and exits 0 immediately if the queue is drained.
# Re-running the whole pool after a partial run only executes the arms still in pending/.
#
# NO CODE CHANGES: pure orchestration. It calls the same experiments.scripts.run_ablation and
# $CODE/jobs/tts_job_lib.py that every other job uses.
#
# CLUSTER-AGNOSTIC: everything cluster-specific is an env var or a <PLACEHOLDER> below.

command_script: |
  set -uo pipefail

  # ---- code (adapt or replace with your own checkout/mount) ----
  CODE="${CODE:-$PWD}"                            # dir containing the Protein-TTS package
  cd "$CODE"

  # ---- job parameters ----
  METHOD="${METHOD:-tds_epi}"                     # tds_epi | tds_cdr, or the stale svgd* modes
  RUN_DIR="${RUN_DIR:-./runs/steer_${METHOD}}"    # shared output root (all workers + the queue)
  INPUTS_WIRED="${INPUTS_WIRED:-./runs/inputs_wired}"   # MSA-wired input jsons
  TARGETS="${TARGETS:-9atr_nb2}"                  # space-separated target ids
  N_SEEDS="${N_SEEDS:-2}"                         # MSA subsamples per arm
  N_SAMPLES="${N_SAMPLES:-50}"                    # diffusion samples per seed = particles per umbrella pool
  SEED0="${SEED0:-101}"                           # first inference seed
  WORKER_ID="${WORKER_ID:-0}"
  N_WORKERS="${N_WORKERS:-1}"
  MAX_ATTEMPTS="${MAX_ATTEMPTS:-2}"               # dead-letter an arm after this many claims
  # DockQ needs numpy<2, the sampler needs numpy>=2, so scoring runs under its own interpreter.
  SCORE_PY="${SCORE_PY:-${TTS_ROOT:-/data/tts}/venv_score/bin/python}"
  SCORE_DOCKQ="${SCORE_DOCKQ:-${TTS_ROOT:-/data/tts}/venv_score/bin/DockQ}"

  # ---- WHICH CO-FOLDING MODEL ---- (full note in tts-cast-pool.yaml)
  BACKEND="${BACKEND:-protenix2}"
  SCORE_BACKEND="${SCORE_BACKEND:-$BACKEND}"      # the results reader must follow the model
  # VALIDATE THE NAME, because $BACKEND is interpolated into config keys. Full note in tts-cast-pool.yaml.
  case "$BACKEND" in
    protenix2|opendde) ;;
    *) echo "!! BACKEND=$BACKEND is not a known backend (protenix2|opendde)"; exit 2 ;;
  esac
  TTS_CFG_SUFFIX="${TTS_CFG_SUFFIX:-}"
  DET_SET="model.${BACKEND}.deterministic=true"   # the key is namespaced per backend
  if [ "$BACKEND" = "opendde" ]; then
    # OpenDDE ships in its OWN venv, so the backend shells out to that console script. Both vars are
    # REQUIRED: an unset OPENDDE_BIN makes the backend derive a bare `python`, which cannot import
    # runner.cli and fails every unit AFTER the job is admitted and holds a GPU.
    export OPENDDE_ROOT_DIR="${OPENDDE_ROOT_DIR:?set OPENDDE_ROOT_DIR (holds the abag checkpoint)}"
    export OPENDDE_BIN="${OPENDDE_BIN:?set OPENDDE_BIN to the opendde console script inside its venv}"
    [ -x "$OPENDDE_BIN" ] || { echo "OPENDDE_BIN=$OPENDDE_BIN is not executable"; exit 2; }
  fi
  cfg_for_backend () {
    [ -z "$TTS_CFG_SUFFIX" ] && { echo "$1"; return 0; }
    local _c="${1%.yaml}${TTS_CFG_SUFFIX}.yaml"
    [ -f "$_c" ] || { echo "!! no $BACKEND config for this arm: $_c (from $1)" >&2; return 1; }
    echo "$_c"
  }
  # GT_INDEX MUST EXIST BEFORE A GPU IS TAKEN. The old default here was ${TTS_ROOT:-/data/tts}/gt_index.csv, a
  # path that has never existed, so scoring silently produced nothing until a launcher happened to
  # override GT_INDEX. Same wording and same gate as the other pool templates.
  GT_INDEX="${GT_INDEX:?set GT_INDEX to the target_index.csv of the dataset being run}"
  if [ "${SCORE_JOBS:-1}" -gt 0 ] && [ ! -f "$GT_INDEX" ]; then
    echo "!! GT_INDEX does not exist: $GT_INDEX" >&2
    echo "!! Point GT_INDEX at a target_index.csv, or set SCORE_JOBS=0 to score externally." >&2
    exit 2
  fi
  SCORE_JOBS="${SCORE_JOBS:-3}"                  # max concurrent background scorers per worker

  # Grid axes, and which knob the CLIPS axis drives.
  # AUTO CLIP IS THE DEFAULT. An absolute cap cannot mean the same thing across targets: the
  # equivalent of 700 spans 668-976 over the 8-target subset (atom counts 4185-8945).
  # An arm that wants absolute behaviour must ask for CLIP_KNOB=guidance_max_norm.
  CLIP_KNOB="${CLIP_KNOB:-guidance_max_rms_a}"
  # BOTH CLIP KEYS, ALWAYS, WITH THE UNUSED ONE ZEROED. guided_step gives guidance_max_rms_a
  # absolute precedence whenever it is > 0, and the configs ship a non-zero one, so an arm that sets
  # only guidance_max_norm HAS NO CLIP AXIS: every CLIPS value runs at the config's rms_a budget and
  # the sweep reports a flat line it cannot explain. Emitting the pair is the only form under which
  # $CLIP_KNOB means what it says in both directions. clip_tag keeps the arm-name convention
  # (r = per-atom RMS, c = absolute cap) so existing run directories still resolve.
  clip_set() {
    if [ "$CLIP_KNOB" = "guidance_max_rms_a" ]; then
      echo "method.diffusion_search.guidance_max_rms_a=${1}.0 method.diffusion_search.guidance_max_norm=0"
    else
      echo "method.diffusion_search.guidance_max_norm=${1}.0 method.diffusion_search.guidance_max_rms_a=0"
    fi
  }
  clip_tag() { if [ "$CLIP_KNOB" = "guidance_max_rms_a" ]; then echo "r$1"; else echo "c$1"; fi; }
  case "$METHOD" in
    tds_epi)
      ALGO=tds; REWARD=epitope; UNITS=centroid_A
      # d* are paratope-epitope CENTROID DISTANCES. 6 umbrellas span the measured native range over
      # the 52 targets (min 6.38, median 11.58, max 16.64) to within ~1 A, and at 50 samples give
      # 9/9/8/8/8/8 particles per umbrella -- enough for stratified resampling to actually select.
      UMBRELLA="${UMBRELLA:-9,11,13,15}"
      # Refines around the optimum, between the arm that barely moves and the one that ejects.
      # Covered already and NOT repeated: scale {5,25,100,200,400}, clip {50,200,500,1000,5000}.
      SCALES="${SCALES:-75 150 300}"; CLIPS="${CLIPS:-12}" ;;
    tds_epi_rms)
      # SIZE-INVARIANT CLIP sweep. Like tds_epi but the clip axis drives guidance_max_rms_a
      # (Angstrom per DEGREE OF FREEDOM) rather than guidance_max_norm (absolute). An absolute cap
      # cannot mean the same thing across targets: over the 8-target subset the equivalent absolute
      # clip spans 668-976 (atom counts 4185-8945). Swapping the absolute cap for its
      # size-invariant equivalent improves min site distance on every target, but that equivalent
      # was never TUNED, it is clip 700 rewritten for one target. This sweeps the magnitude around
      # it.
      ALGO=tds; REWARD=epitope; UNITS=centroid_A
      UMBRELLA="${UMBRELLA:-9,11,13,15}"
      SCALES="${SCALES:-75}"; CLIPS="${CLIPS:-3 6 12 24}"
      CLIP_KNOB=guidance_max_rms_a ;;
    tds_dstar)
      # D* sweep. d* is the ARRIVAL RADIUS at which site_hinge stops pulling, so it is the knob on
      # PROXIMITY, not on allocation. The tilt is what fixes which cell a particle occupies, and it
      # enriches the true-site cell by orders of magnitude with resampling ON or OFF.
      # Swept as SINGLE-value umbrellas, one per arm, because the
      # question is which radius is best -- NOT the multi-umbrella hedge tds_epi uses.
      # It composes with MAP ERROR: total site error is bounded by map error + d*, so a d* tuned
      # against a 4 A map is not the value for a 12 A one. Sweep on the map you will deploy.
      ALGO=tds; REWARD=epitope; UNITS=centroid_A
      # UMBRELLA must be SET even though every arm overrides it: the script runs under `set -u` and
      # $COMMON references it, so leaving it unset aborts the worker with "UMBRELLA: unbound
      # variable" before any arm is built. The per-arm umbrella_sweep is appended AFTER $COMMON, so
      # the later --set wins.
      UMBRELLA="${UMBRELLA:-12}"
      DSTARS="${DSTARS:-6 9 12}"
      SCALES="${SCALES:-75}"; CLIPS="${CLIPS:-12}" ;;
    tds_sched)
      # RESAMPLING SCHEDULE. Gradient is ALWAYS on (schedule_start_frac early), only the resample
      # WINDOW moves. Placement and count are confounded unless both are set: og30 changed the
      # window AND ended up with 2 events against standard's 3-4, so its gain could not be
      # attributed. Each arm here pins both.
      # Scoring events fire at start_step + k*every (NOT at multiples of every -- validated against
      # two run logs), so with start 0.25 and every 20 they land at 50,70,...,190.
      ALGO=tds; REWARD=epitope; UNITS=centroid_A
      UMBRELLA="${UMBRELLA:-9,11,13,15}"
      SCALES="${SCALES:-75}"; CLIPS="${CLIPS:-12}"
      # "<name>:<resample_start_frac>:<resample_end_frac>"  (resamples / noise steps left after last)
      SCHED_START="${SCHED_START:-0.25}"   # guidance start, shared by the control via $COMMON
      # "<name>:<start>:<end>[:<every>]". The 4th field is OPTIONAL and defaults to the config's 20,
      # so every existing SCHEDS string is bit-identical.
      #
      # WHY `every` IS NOW AN AXIS. A wider late window produces BYTE-IDENTICAL structures to a
      # narrower one, because both fire the same events.
      # The window does not SCHEDULE resampling, it only PERMITS it: a resample needs
      # ESS < ess_fraction*N as well, and ESS RECOVERS as the trajectory proceeds. So widening a late
      # window is free of cost and free of benefit, and the only reliable lever on the event count is
      # how often ESS is CHECKED.
      SCHEDS="${SCHEDS:-early2:0.25:0.35 early4:0.25:0.55 late2:0.60:0.80 late4:0.65:0.95}" ;;
    tds_cdr)
      ALGO=tds; REWARD=cdr_rmsd; UNITS=rmsd_A
      # d* are CONFORMATIONAL RMSD shells, a different unit from the site CV and NOT interchangeable.
      # 7 shells at 1 A spacing over the measured reachable range (pool p50 3.25, max 6.12), giving
      # 8/7/7/7/7/7/7 particles per umbrella at 50 samples. The top shell stays under the 7.88 A
      # natural pairwise ceiling, above which the fold is torn rather than diversified.
      UMBRELLA="${UMBRELLA:-0.5,1.5,2.5,3.5,4.5,5.5,6.5}"
      # Lower scales than the site CV. The CDR CV deforms loops directly and tears far earlier than
      # the site CV, reaching the distortion ceiling by scale 25, so it needs its own range.
      # CLIP NOT changed to the site default of 12: this CV is conformational RMSD, a different
      # unit from the site centroid CV, so the 12 calibration does not transfer. Absolute caps
      # kept, which also means this branch must pin the knob back to guidance_max_norm.
      SCALES="${SCALES:-8 40 60}"; CLIPS="${CLIPS:-150 350 700}"
      CLIP_KNOB=guidance_max_norm ;;
    tds_sc)
      # SITE + CONTACT. The site CV alone cannot raise DockQ far, because DockQ is gated by fnat
      # and a centroid distance constrains 1 of 6 pose DOF, so the best structures can still reach
      # fnat 0 at a large LRMS. This adds a smooth contact-shell term peaked at r_contact.
      ALGO=tds; REWARD=site_contact; UNITS=centroid_A
      UMBRELLA="${UMBRELLA:-9,11,13,15}"
      # Held at the measured best site setting so the ONLY variable is the contact weight.
      SC_SCALE="${SC_SCALE:-100}"; SC_CLIP="${SC_CLIP:-500}"
      # WEIGHT IS CALIBRATED, NOT GUESSED. On real pools the contact term spans about 1e-4 to 1e-1
      # while the site term runs from about -145 far away to -20 near the site. So weight ~1 is
      # INERT and the interesting crossover is 1e2-1e3: at w=1000 the site term still dominates far
      # away but contacts take over near the site, which is the intended "approach, then refine"
      # behaviour.
      # cw0 is the pure-site reference and must reproduce reward=epitope bit-for-bit.
      CONTACT_WEIGHTS="${CONTACT_WEIGHTS:-0 300 1000 3000}"
      CONTACT_R="${CONTACT_R:-8.0}"; CONTACT_SIGMA="${CONTACT_SIGMA:-2.0}" ;;
    svgd|svgd_bw|svgd_sn)
      # STALE AND UNSUPPORTED. algorithm=svgd is in family `interaction` while this template's
      # configs declare `guidance`, and no m3_svgd.yaml ships, so these arms would claim a GPU and
      # then die inside run_ablation. Refuse here instead. See the note at DIFFUSION_FAMILIES in
      # method/diffusion_side/diffusion_search.py.
      echo "!! METHOD=$METHOD is stale and unsupported: algorithm=svgd has no config in this repo."
      echo "!! Use METHOD=tds_epi or tds_cdr."
      exit 2 ;;
    *) echo "!! unknown METHOD=$METHOD (tds_epi | tds_cdr | tds_sc)"; exit 2 ;;
  esac

  Q="$RUN_DIR/queue"; PENDING="$Q/pending"; CLAIMED="$Q/claimed"; DONE="$Q/done"; FAILED="$Q/failed"
  HB="$Q/heartbeat"; FORCE="$Q/force_offload"; OOMLOG="$RUN_DIR/oom_events.jsonl"
  mkdir -p "$RUN_DIR" "$PENDING" "$CLAIMED" "$DONE" "$FAILED" "$HB" "$FORCE"
  # LOG NAME MUST BE UNIQUE PER POD, NOT PER WORKER_ID. Full note in tts-cast-pool.yaml.
  LOG="$RUN_DIR/worker_${WORKER_ID}_${HOSTNAME:-$$}.log"; exec > >(tee -a "$LOG") 2>&1
  # ...and the per-unit run.log written by run_unit stays the AUTHORITY for what an arm did.
  # Never attribute a health line from the worker log to a unit, read $RUN_DIR/<unit>/run.log.
  echo "===== steering pool: METHOD=$METHOD worker $WORKER_ID/$N_WORKERS $(date -u) ====="
  nvidia-smi -L || true
  # ---- REFUSE TO START ON AN OCCUPIED CARD ---- (full note in tts-cast-pool.yaml)
  _gpu_idx="${CUDA_VISIBLE_DEVICES:-}"; _gpu_idx="${_gpu_idx%%,*}"
  case "${_gpu_idx:-}" in
    "")       echo "[startup] occupied-card check skipped (no CUDA_VISIBLE_DEVICES)" ;;
    *[!0-9]*) echo "[startup] occupied-card check skipped ($_gpu_idx is not a device index)" ;;
    *)
      _busy=$(nvidia-smi --query-gpu=index,memory.used --format=csv,noheader,nounits 2>/dev/null \
              | awk -F', *' -v i="$_gpu_idx" '$1 == i {print $2}')
      if [ -n "${_busy:-}" ] && [ "$_busy" -gt "$(( ${GPU_BUSY_GIB:-8} * 1024 ))" ]; then
        echo "!! GPU $_gpu_idx already holds ${_busy} MiB, over the ${GPU_BUSY_GIB:-8} GiB start bar."
        echo "!! On a multi-GPU pod EVERY worker needs its OWN device. Two workers on one card is"
        echo "!! how a unit is lost to a fake size-OOM. Give this worker a free index, or raise"
        echo "!! GPU_BUSY_GIB to share on purpose."
        exit 5
      fi
      echo "[startup] GPU $_gpu_idx holds ${_busy:-0} MiB before this worker starts" ;;
  esac
  echo "CODE TREE: $CODE"

  . "${VENV:-/opt/venv}/bin/activate" 2>/dev/null || true
  export PYTHONPATH="$CODE"
  # ---- CHECKPOINT ROUTE ---- (full note in tts-b0b.yaml)
  export PROTENIX_ROOT_DIR="${PROTENIX_ROOT_DIR:-${APP_ROOT:-/opt/cofold}/protenix/cache}"
  # The public cache. Unset means "the package default", a different directory per image that cannot be
  # pre-seeded or checked. Defaults to the private root so one cache serves both branches.
  # Gated with PROTENIX_ROOT_DIR above, and it MUST be: this body runs under `set -u`, so once that
  # variable is only set for Protenix, an ungated ${...:-$PROTENIX_ROOT_DIR} here aborts every
  # OpenDDE run with "PROTENIX_ROOT_DIR: unbound variable" instead of falling back.
  if [ "$BACKEND" = "protenix2" ]; then
    export PROTENIX_PUBLIC_ROOT_DIR="${PROTENIX_PUBLIC_ROOT_DIR:-$PROTENIX_ROOT_DIR}"
  fi
  # THERE IS NO DOWNLOAD BRANCH. Full note in tts-b0b-pool.yaml.
  # Say which route WON before the GPU starts, rather than leaving it in a run log 20 minutes in.
  # GATED ON $BACKEND: this resolves PROTENIX weights. Ungated it also ran on OpenDDE
  # units and announced a protenix-v2 cache at the top of a run that never builds a
  # Protenix model. Inert, but the first line a reader sees was about the wrong model.
  if [ "$BACKEND" = "protenix2" ]; then
    python "$CODE/jobs/tts_job_lib.py" checkpoint-route --code-tree "$CODE" || true
  else
    _ck="$OPENDDE_ROOT_DIR/checkpoint/opendde_abag.pt"
    if [ -f "$_ck" ]; then echo "[route] backend=opendde checkpoint=$_ck (antibody-antigen)"
    else echo "[route] backend=opendde checkpoint=MISSING at $_ck -> --model_name opendde_v1 (general)"; fi
  fi

  # NO LAYER-NORM PROBE HERE, deliberately. Full note in tts-cast-pool.yaml.
  export PROTEIN_TTS_DATASET="${PROTEIN_TTS_DATASET:-collected_bad_cases}"
  # Ground truth MUST resolve or DockQ/CA-RMSD are written as NaN with no error at all.
  export FOLDBENCH_ROOT="${FOLDBENCH_ROOT:?set FOLDBENCH_ROOT; <ROOT>/ground_truths must exist}"
  export PROTENIX_CDR_MAP="${PROTENIX_CDR_MAP:?set PROTENIX_CDR_MAP}"
  export PROTENIX_EPITOPE_MAP="${PROTENIX_EPITOPE_MAP:?set PROTENIX_EPITOPE_MAP}"
  export CUBLAS_WORKSPACE_CONFIG=:4096:8 LAYERNORM_TYPE=torch
  # AUTO CONFIDENCE-OFFLOAD. Full note in tts-cast-pool.yaml.
  export PROTENIX_CONF_OFFLOAD_TOKENS="${PROTENIX_CONF_OFFLOAD_TOKENS:-auto}"
  # TRUE-epitope map for the per-sample RIGHT-SITE column (`site_dist_a`). Unset = the column is
  # simply null, the scorer never fails on it.
  export PROTENIX_TRUE_EPITOPE="${PROTENIX_TRUE_EPITOPE:-}"
  # PARITY WITH tts-b0b-pool.yaml. Full note in tts-cast-pool.yaml.
  export PROTENIX_SAMPLE_DIFFUSION_CHUNK_SIZE="${PROTENIX_SAMPLE_DIFFUSION_CHUNK_SIZE:-auto}"
  # 750 rather than 800: a target just under the rail is kept ON-GPU and CUDA-OOMs, while targets
  # above the rail offload and complete cleanly. The memory model is optimistic by 5-7 GiB near the
  # top of a 40 GB card, and 750 moves the 750-800 band to the safe side. It costs a little
  # throughput, since offload is a fitting tool and not a speedup.
  export PROTENIX_MAX_ONGPU_TOKENS_40G="${PROTENIX_MAX_ONGPU_TOKENS_40G:-750}"   # ceiling on a 40GB card
  export PROTENIX_MAX_ONGPU_TOKENS_80G="${PROTENIX_MAX_ONGPU_TOKENS_80G:-950}"   # ceiling on an 80GB card
  export PROTENIX_OOM_SKIP="${PROTENIX_OOM_SKIP:-1}"                # GPU OOM: skip the target's remaining seeds
  export PYTORCH_CUDA_ALLOC_CONF="${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

  # ---- helper scripts must EXIST before any GPU work. They are called per-arm to score the pool,
  #      and a missing one fails SILENTLY: the arm runs, writes its structures, retires to done/ and
  #      never emits a row. Fail loudly here instead.
  STATS_DIR="${STATS_DIR:-$CODE/jobs}"

  # ONE DATASET, checked BEFORE a GPU is taken. Full note in tts-cast-pool.yaml.
  python "$STATS_DIR/tts_job_lib.py" dataset-check --targets "$TARGETS" \
    --inputs-wired "$INPUTS_WIRED" --gt-index "$GT_INDEX" --foldbench-root "$FOLDBENCH_ROOT" \
    ${PROTENIX_CDR_MAP:+--map "PROTENIX_CDR_MAP=$PROTENIX_CDR_MAP"} \
    ${EPI_HYBK12:+--map "EPI_HYBK12=$EPI_HYBK12"} \
    ${EPI_TRUE:+--map "EPI_TRUE=$EPI_TRUE"} \
    ${EPI_SHUF:+--map "EPI_SHUF=$EPI_SHUF"} \
    ${PROTENIX_TRUE_EPITOPE:+--map "PROTENIX_TRUE_EPITOPE=$PROTENIX_TRUE_EPITOPE"} \
    || { echo "!! dataset-check failed: the run would mix datasets. Fix the paths above."; exit 2; }
  MISSING=""
  # Only tts_job_lib.py is guarded, because nothing external is required: the pool readouts are its
  # `pool-stats` subcommand (div_conf / div_site / div_jac) and the oracle distance is `epi-dist`.
  # A missing helper fails SILENTLY otherwise: the arm runs, writes its structures, retires to
  # done/ and simply never emits a row.
  for _f in tts_job_lib.py; do
    [ -f "$STATS_DIR/$_f" ] || MISSING="$MISSING $_f"
  done
  if [ -n "$MISSING" ]; then
    echo "!! missing helper script(s) in $STATS_DIR:$MISSING"
    echo "!! scoring would fail silently and the grid would produce no rows -- aborting"
    exit 3
  fi
  echo "[startup] helper scripts present in $STATS_DIR"

  # ---- build the arm list ---- (full note in tts-cast-pool.yaml)
  EPI_SOURCE="${EPI_SOURCE:-predicted}"
  # THE DEFAULT MAP IS THE HYBRID ONE, ENFORCED AS A CONTRACT RATHER THAN A PATH. Defaulting
  # $PROTENIX_EPITOPE_MAP to a file would hardcode a cluster path and would silently pick one of the
  # several hybrid variants on disk, which is the hidden-default problem this block already exists to
  # stop. Instead the map stays mandatory and the BUILDER is declared: the preflight compares this
  # against the map's own `_builder` stamp, so passing a DiscoTope-3 or direction-umbrella map now
  # fails the gate unless the arm says so with EPI_BUILDER. Set EPI_BUILDER="" to skip the check.
  #
  # THE DEFAULT TILING IS THE ENSEMBLE ONE, i.e. the hybrid whose surface tiles are
  # built on the POOL-MEAN geometry (mean pairwise + mean centroid distance over 100 structures)
  # rather than on whichever single conformer sorted first. Rebuild the map with
  # `token_maps.py tiles-ensemble --fill-to 15 --modes-json <modes>` and then `hybrid`; a map built
  # with the old single-conformer `tiles` stamps `hybrid_modes_tiles` and will now FAIL this gate,
  # which is the intended behaviour -- the two are different maps and must not share a label.
  #
  # THE DEFAULT IS THE SINGLE-CONFORMER BUILD (hybK12). Against the true epitope it reaches a few
  # more targets in the 6 and 8 A bands than the pool-mean (ensemble) tiling. The 6 A band is what
  # matters downstream: on a target where the two maps disagree, swapping the map at a FIXED
  # schedule moves max dockq_abag several times more than the resampling schedule or the clip rail
  # does, because only structures that reach within 6 A of the true epitope score at all.
  #
  # WHAT THIS COSTS, and it is a real cost. The ensemble build buys STABILITY: rebuilt from
  # disjoint subsets of the same pool, its tilings agree far more closely and its per-target best
  # candidate barely moves. **The
  # single-conformer map is reproducible only while the pool directory is FROZEN, because the tiling
  # is a function of which filename sorts first.** Ship the built map FILE (with a checksum) rather
  # than the recipe, and treat a pool change as a map change. Set
  # EPI_BUILDER=hybrid_modes_ensemble_tiles to go back to the stable build.
  EPI_BUILDER="${EPI_BUILDER-hybrid_modes_tiles}"
  # DEFAULT true, MATCHING tts-tds-pool.yaml (which pins site_hinge=true). false is the DISTORTING
  # reward: without the hinge r = -(d-d*)^2 is maximised only on the SHELL d=d*, so lambda->0
  # concentrates on a measure-zero set instead of the ball {d<=d*}, and the limit is no longer a
  # conditional of the base model.
  # The two pool templates disagreeing on this is exactly how one silently runs a different method
  # than the other while both report "reward=epitope".
  # CROSS-SUBSAMPLE POOL. 1 = the SEPARATE model (default, unchanged): each MSA subsample gets its
  # own trunk pass and its own diffusion. K > 1 = the JOINT model: one N-particle diffusion over all
  # K conditionings, which is the only way a particle filter can compare subsamples at all.
  # K MUST EQUAL N_SEEDS. The hook defers the diffusion until the K-th subsample arrives, so if K is
  # larger than the number of subsamples actually built, the real diffusion never fires and the run
  # emits only the one-particle placeholders -- a silent near-empty pool, not an error.
  SUBSAMPLE_POOL="${SUBSAMPLE_POOL:-1}"
  if [ "$SUBSAMPLE_POOL" -gt 1 ] && [ "$SUBSAMPLE_POOL" -ne "$N_SEEDS" ]; then
    echo "!! SUBSAMPLE_POOL=$SUBSAMPLE_POOL must equal N_SEEDS=$N_SEEDS for the joint pool:"
    echo "!! the diffusion is deferred until the K-th subsample, so a mismatch never fires it."
    exit 1
  fi
  # THE lambda*r_0 LEVEL TERM, opt-in and OFF by default. Full note in tts-cast-pool.yaml.
  WEIGHT_LEVEL_CORRECTION="${WEIGHT_LEVEL_CORRECTION:-false}"
  # ESCAPE HATCH for one-off overrides. Full note in tts-cast-pool.yaml.
  EXTRA_SET="${EXTRA_SET:-}"
  SITE_HINGE="${SITE_HINGE:-true}"
  # 4.0 MATCHES tts-tds-pool.yaml. The spec default 0.0 is purely quadratic far from target, so a
  # template left on it would apply a different reward shape while still reporting
  # reward=epitope.
  SITE_HUBER="${SITE_HUBER:-4.0}"
  # A method that pins WHEN guidance starts sets SCHED_START, and it goes into $COMMON so the
  # CONTROL inherits the same value. Pinning it per-arm in the grid loop instead leaves the control,
  # which never enters that loop, on the config default while every steered arm runs the pinned
  # value. It is inert at guidance_scale=0, but it makes the control's own config disagree with its
  # experiment. Empty default keeps every other METHOD bit-identical.
  SCHED_START="${SCHED_START:-}"
  # GAPPED RESAMPLE WINDOWS, opt-in. SCHEDS expresses ONE window (start:end[:every]), so a schedule
  # that resamples early and again late with a gap between (early2+late2 = steps 50,70,130,150) is
  # not reachable through it. Semicolon-separated pairs, e.g. "0.25:0.35;0.60:0.80". Empty leaves
  # every existing arm byte-identical, and when set it REPLACES resample_start/end_frac.
  # early2 IS THE DEFAULT WINDOW, EXCEPT for tds_sched. That branch sets its window
  # PER ARM through resample_start/end_frac, and a non-empty resample_windows REPLACES those, so a
  # blanket default would collapse the whole schedule sweep into repeated early2 arms with no
  # error anywhere. Note `:-` treats EMPTY as unset, so the branch cannot simply clear it.
  # AND THE DEFAULT CARVE-OUT IS NOT ENOUGH: `:-` only guards the UNSET case, so an explicitly
  # exported RESAMPLE_WINDOWS sails straight past it into $COMMON and overrides every single-window
  # sched arm, making it BYTE-IDENTICAL to the early2 arm. The @-form arms are unaffected, because
  # their own resample_windows comes after $COMMON and wins, which is exactly how such a mix hides.
  # Refuse the combination instead of silently picking a winner.
  if [ "$METHOD" = "tds_sched" ]; then
    if [ -n "${RESAMPLE_WINDOWS:-}" ]; then
      echo "!! RESAMPLE_WINDOWS='$RESAMPLE_WINDOWS' cannot be set with METHOD=tds_sched."
      echo "   Every sched arm owns its window, and a global one REPLACES resample_start/end_frac,"
      echo "   collapsing single-window arms into duplicates of it with no error at runtime."
      echo "   Put the window in the SCHEDS entry instead: 'name:start:end' or 'name@w1;w2'."
      exit 2
    fi
    RESAMPLE_WINDOWS=""
  else RESAMPLE_WINDOWS="${RESAMPLE_WINDOWS:-0.25:0.35}"; fi
  RW_SET=""
  [ -n "$RESAMPLE_WINDOWS" ] && RW_SET="method.diffusion_search.resample_windows=$RESAMPLE_WINDOWS"
  SCHED_SET=""
  [ -n "$SCHED_START" ] && SCHED_SET="method.diffusion_search.schedule_start_frac=$SCHED_START"
  COMMON="method.diffusion_search.algorithm=$ALGO method.diffusion_search.reward=$REWARD \
  method.diffusion_search.rmsd_subset=paratope method.diffusion_search.sweep_units=$UNITS \
  method.diffusion_search.epitope_source=$EPI_SOURCE \
  method.diffusion_search.epitope_map_builder=$EPI_BUILDER \
  method.diffusion_search.site_hinge=$SITE_HINGE method.diffusion_search.site_huber_delta=$SITE_HUBER \
  method.diffusion_search.subsample_pool=$SUBSAMPLE_POOL \
  method.diffusion_search.weight_level_correction=$WEIGHT_LEVEL_CORRECTION \
  method.diffusion_search.umbrella_sweep=$UMBRELLA $SCHED_SET $RW_SET $EXTRA_SET"
  # DEFERRED SCORING MUST NOT BE SILENT. Full note in tts-cast-pool.yaml.
  if [ "$SCORE_JOBS" -eq 0 ]; then
    _hb="$RUN_DIR/queue/.pool_score_hb"
    _age=99999
    # `cat` on an empty or half-written stamp yields "", and $(( now -  )) is a bash
    # SYNTAX ERROR that kills the worker before it runs a single unit. The writer
    # renames into place, and this accepts only an all-digit stamp, so a torn read
    # degrades to "no heartbeat" instead of to a crash.
    _ts=$(cat "$_hb" 2>/dev/null | tr -dc '0-9')
    [ -n "$_ts" ] && _age=$(( $(date +%s) - _ts ))
    if [ "$_age" -gt 900 ]; then
      echo "!! SCORE_JOBS=0 but no live pool-score heartbeat at $_hb (age ${_age}s)."
      echo "!! Nothing in this pod will score these units. Start it on a CPU pod:"
      echo "!!   python jobs/tts_job_lib.py pool-score --run-dir $RUN_DIR"
      date -u > "$RUN_DIR/NEEDS_EXTERNAL_SCORING"
    else
      echo "[scoring] deferred to pool-score (heartbeat ${_age}s old)"
      rm -f "$RUN_DIR/NEEDS_EXTERNAL_SCORING" 2>/dev/null || true
    fi
  fi
  ARMS=()
  # CONTROL. $COMMON FIRST so every descriptive field (reward, umbrella, site_hinge, sweep_units,
  # epitope_source) matches the steered arms, THEN the inert overrides, which win because a later
  # --set wins. Without $COMMON the control silently fell back to the CONFIG DEFAULTS and its resolved
  # config.yaml read reward=cdr_rmsd and umbrella_sweep=0.5,3,5.5,8 while the steered arms read
  # reward=epitope and umbrella_sweep=12. Those fields are INERT at guidance_scale=0 (measured:
  # guidance=0 resamples=0 on every control arm), so no number ever changed -- but a control whose
  # config disagrees with its own experiment is indefensible in a paper table and invites exactly the
  # "was this really the same setup" question a reviewer should not have to ask.
  # THE CONTROL IS OMITTED BY DEFAULT (SKIP_CTRL defaults to 1). Set SKIP_CTRL=0 to run one here.
  # A control is guidance_scale=0 and every steering field is INERT there, so a ctrl unit depends
  # only on (target, seed, n_samples, backend) and is IDENTICAL across maps, umbrellas, d*, clips
  # and schedules. Adding one to EVERY job makes a campaign split over several pool jobs re-run the
  # same control several times, about 3 GPU-hours per redundant copy at 8 targets x 240 samples, so
  # it is opt-in and reused instead. A steered arm reported without a control at ITS OWN budget has
  # no baseline.
  if [ "${SKIP_CTRL:-1}" != "1" ]; then
    # THE CONTROL MUST NOT INHERIT $COMMON. Inheriting it leaves an "inert" arm still running the
    # hook with the umbrella/site cell partition AND a resample window. Guidance and lam are zero,
    # so no steering FORCE acts, but the sampler is still not stock Protenix: the hook draws ONE
    # coupled trajectory over the population where Protenix draws an independent one per chunk, and
    # it resamples within cells. Against a pure Best-of-N pool at matched budget such a "control"
    # scores ABOVE the unsteered baseline, which overstates the control and understates every gain
    # measured against it.
    # THE CONTROL IS PURE BEST-OF-N: mode `stock`, no diffusion_search sets at all, so
    # run_ablation builds NO search spec and the hook is never installed (_ACTIVE_DIFF stays None).
    # An "inert" arm -- algorithm=fk with lam=0 and guidance_scale=0 -- is NOT the same thing and
    # must not be used as the baseline: the hook still draws ONE coupled trajectory over the
    # population where stock Protenix draws an independent one per chunk, and it still resamples
    # within umbrella/site cells. Such an arm scores ABOVE the unsteered baseline, so every gain
    # measured against it is understated. The right form is
    # `ARMS+=("bon|stock|")`.
    ARMS+=("ctrl|stock|")
  else
    echo "[arms] control omitted (SKIP_CTRL default 1). Reuse a ctrl at the same target/seed/n_samples, or set SKIP_CTRL=0 to run one here."
  fi
  if [ "$METHOD" = tds_sc ]; then
    for cw in $CONTACT_WEIGHTS; do
      ARMS+=("cw${cw}|steer|$COMMON method.diffusion_search.guidance_scale=${SC_SCALE}.0 \
  method.diffusion_search.guidance_max_norm=${SC_CLIP}.0 method.diffusion_search.contact_weight=$cw \
  method.diffusion_search.contact_r=$CONTACT_R method.diffusion_search.contact_sigma=$CONTACT_SIGMA")
    done
  else
    if [ "$METHOD" = "tds_dstar" ]; then
      # HONOUR $CLIP_KNOB HERE TOO. This branch hardcoded guidance_max_norm, so a d* sweep could only
      # use the ABSOLUTE clip, and an absolute cap cannot transfer across targets
      # (atom counts span 2.14x, so one number is a 1.46x different per-atom budget). A d* sweep over
      # 8 targets on an absolute clip therefore confounds d* with target size. Same spelling as the
      # tds_epi_rms branch, so CLIP_KNOB=guidance_max_rms_a gives a size-invariant d* sweep.
      for sc in $SCALES; do for cl in $CLIPS; do for ds in $DSTARS; do
        ARMS+=("s${sc}_$(clip_tag "$cl")_d${ds}|steer|$COMMON \
        method.diffusion_search.guidance_scale=${sc}.0 $(clip_set "$cl") \
        method.diffusion_search.umbrella_sweep=${ds}")
      done; done; done
      elif [ "$METHOD" = "tds_sched" ]; then
        for sc in $SCALES; do for cl in $CLIPS; do for sd in $SCHEDS; do
          # TWO ENTRY FORMS.
          #   "name:start:end[:every]"   ONE window  -> resample_start_frac / resample_end_frac
          #   "name@w1s:w1e;w2s:w2e"     MANY windows -> resample_windows
          # The multi-window form needs its own separator because the single-window parser splits on
          # ":", so a semicolon list would be silently truncated to its first pair. Before this a
          # multi-window schedule such as early2+late1 could not be expressed as a sched arm at all
          # and had to be run as a whole separate job with RESAMPLE_WINDOWS set globally.
          case "$sd" in
            *@*)
              nm="${sd%%@*}"
              ARMS+=("${nm}|steer|$COMMON method.diffusion_search.guidance_scale=${sc}.0 \
    $(clip_set "$cl") \
    method.diffusion_search.resample_windows=${sd#*@}") ;;
            *)
              nm="${sd%%:*}"; rest="${sd#*:}"; rs="${rest%%:*}"; rest="${rest#*:}"
              re="${rest%%:*}"; ev=""
              # leading space lives INSIDE $ev so a 3-field entry emits a byte-identical spec
              case "$sd" in *:*:*:*) ev=" method.diffusion_search.schedule_every=${sd##*:}" ;; esac
              ARMS+=("${nm}|steer|$COMMON method.diffusion_search.guidance_scale=${sc}.0 \
    $(clip_set "$cl") \
    method.diffusion_search.resample_start_frac=${rs} method.diffusion_search.resample_end_frac=${re}${ev}") ;;
          esac
        done; done; done
    else
    for sc in $SCALES; do for cl in $CLIPS; do
      ARMS+=("s${sc}_$(clip_tag "$cl")|steer|$COMMON \
  method.diffusion_search.guidance_scale=${sc}.0 $(clip_set "$cl")")
    done; done
    fi
  fi

  # ---- PREFLIGHT: validate every arm OFFLINE before a single GPU-second. A steering arm can be a
  #      silent NO-OP (an override naming a field that does not exist, a gradient on an algorithm
  #      whose reference has none, a sweep whose units contradict the CV). Those do not crash: they
  #      write structures and report a plausible number. Only worker 0 prints, but ALL workers gate.
  PF=0
  for A in "${ARMS[@]}"; do
    TAG=${A%%|*}; REST=${A#*|}; MODE=${REST%%|*}; SETS=${REST#*|}
    PFSET=$(echo "$SETS" | tr ' ' '\n' | sed 's/^method\.diffusion_search\.//' | tr '\n' ' ')
    # PASS THE REAL POOL SIZE. preflight defaults to 8 particles, which is fine for the checks that
    # only read the spec but wrong for any check that divides the pool across cells: at 8 particles
    # the joint pool looks like 2 per cell and a legitimate K=4 is rejected. N_SAMPLES is the pool
    # each arm actually runs.
    if python "$STATS_DIR/tts_job_lib.py" preflight --set $PFSET --n-particles "$N_SAMPLES" \
         > "$RUN_DIR/pf_$TAG.txt" 2>&1; then
      PFOK=1; else PFOK=0; fi
    if [ "$MODE" = stock ]; then
      echo "[preflight] $TAG: stock sampler, no spec to validate"; continue
    fi
    if [ "$MODE" = inert ]; then
      # A CONTROL MUST BE INERT. If it starts passing the steering gate it is secretly steering and
      # every delta measured against it is wrong.
      [ $PFOK -eq 1 ] && { echo "!! $TAG is declared a CONTROL but preflight says it steers"; PF=1; }
    else
      [ $PFOK -eq 1 ] || { echo "!! arm $TAG failed preflight"; sed 's/^/      /' "$RUN_DIR/pf_$TAG.txt"; PF=1; }
    fi
  done
  [ $PF -ne 0 ] && { echo "!! PREFLIGHT FAILED -- aborting before any GPU work"; exit 1; }
  echo "[preflight] all ${#ARMS[@]} arms valid"

  # ---- seed the queue (idempotent: every worker tries, `mkdir` makes it a no-op for the losers) ----
  for TGT in $TARGETS; do
    for A in "${ARMS[@]}"; do
      U="${TGT}__${A%%|*}"
      [ -d "$DONE/$U" ] && continue
      mkdir -p "$PENDING/$U" 2>/dev/null
      printf '%s' "$A" > "$PENDING/$U/spec" 2>/dev/null || true
    done
  done
  # QUEUE INVARIANT REPAIR. Full note in tts-cast-pool.yaml.
  for U in $(ls "$DONE" 2>/dev/null); do rm -rf "$PENDING/$U" "$CLAIMED/$U"; done
  for U in $(ls "$CLAIMED" 2>/dev/null); do rm -rf "$PENDING/$U"; done

  # total unit count, written once: a summary/merge can gate on done+failed == N_UNITS rather than
  # guessing when the pool is finished (tts-b0b-pool.yaml uses N_TARGETS the same way).
  [ -f "$Q/N_UNITS" ] || echo $(( $(ls "$PENDING" 2>/dev/null | wc -l) + $(ls "$CLAIMED" 2>/dev/null | wc -l) + $(ls "$DONE" 2>/dev/null | wc -l) )) > "$Q/N_UNITS"
  echo "queue: $(ls "$PENDING" 2>/dev/null | wc -l) pending / $(ls "$DONE" 2>/dev/null | wc -l) done / $(cat "$Q/N_UNITS") total"

  # DRY_RUN=1 stops here: the arm list, the preflight gate and the queue are all exercised, but no
  # GPU is touched. Use it to check a grid definition before spending GPU-hours on it.
  if [ "${DRY_RUN:-0}" = "1" ]; then
    echo "[dry-run] ${#ARMS[@]} arms, $(ls "$PENDING" 2>/dev/null | wc -l) queued"
    for A in "${ARMS[@]}"; do echo "  arm: ${A%%|*}"; done
    # CONFIG/FAMILY CHECK. preflight validates spec FIELDS only, run_ablation separately rejects an
    # algorithm that is not in the config's declared family. Take the first steered arm through the
    # real dispatch (--dry-run skips inference) so a family mismatch fails HERE, not on a GPU.
    for A in "${ARMS[@]}"; do
      TAG=${A%%|*}; REST=${A#*|}; MODE=${REST%%|*}; SETS=${REST#*|}
      [ "$MODE" = steer ] || continue
      CFG=experiments/configs/diffusion_side/m2_tds.yaml
      [ "$MODE" = stock ] && CFG=experiments/configs/baseline/b0b.yaml
      case "$SETS" in
        *algorithm=af3_red*) CFG=experiments/configs/diffusion_side/m4_af3red.yaml ;;
      esac
      T=$(mktemp -d); mkdir -p "$T/src"
      cp "$INPUTS_WIRED/$(echo $TARGETS | awk '{print $1}').json" "$T/src/" 2>/dev/null
      echo -n "  [dry-run] dispatch check on $TAG via $(basename $CFG): "
      if timeout 600 python -m experiments.scripts.run_ablation --config "$CFG" --dry-run \
           --set $SETS model.run.msa_subsample.source_inputs_dir="$T/src" model.seeds=[$SEED0] \
                 model.run.n_samples_per_seed=2 model.run.msa_subsample.n_seeds=1 \
                 paths.inputs_dir="$T/i" paths.predictions_dir="$T/p" paths.results_dir="$T/r" \
           > "$T/dry.log" 2>&1; then echo OK
      else echo FAILED; grep -aE "ValueError|Error" "$T/dry.log" | tail -2; rm -rf "$T"; exit 4; fi
      rm -rf "$T"; break
    done
    echo "[dry-run] stopping before GPU work"
    exit 0
  fi

  BASE="$DET_SET model.run.nproc_per_node=1 \
  model.run.n_samples_per_seed=$N_SAMPLES model.run.msa_subsample.n_seeds=$N_SEEDS"
  # SEARCH-ONLY OVERRIDES ARE NOT IN $BASE. Full note in tts-cast-pool.yaml.
  BASE_SEARCH="method.diffusion_search.physicality_filter=false"


  # HOW MANY STRUCTURES A UNIT SHOULD PRODUCE. The separate model runs one diffusion per subsample,
  # so N_SEEDS * N_SAMPLES. The JOINT pool runs ONE diffusion of N_SAMPLES over all K conditionings
  # and emits a single token structure for each of the K-1 deferred entries, so N_SAMPLES + K - 1.
  # Defined ONCE: when this was only in the completion check, the health gate kept its own copy of
  if [ "$SUBSAMPLE_POOL" -gt 1 ]; then
    EXP_CIF=$(( N_SAMPLES + SUBSAMPLE_POOL - 1 ))
  else
    EXP_CIF=$(( N_SEEDS * N_SAMPLES ))
  fi
  unit_generated () {                # $1 = unit name -> 0 if every structure is already on disk
    local O="$RUN_DIR/$1"
    [ "$(find "$O/pred" -name '*.cif' 2>/dev/null | wc -l)" -ge "$EXP_CIF" ] || return 1
    return 0
  }

  unit_complete () {                 # $1 = unit name -> 0 if generated AND scored
    local O="$RUN_DIR/$1"
    [ -f "$O/res/per_sample.parquet" ] || return 1
    unit_generated "$1"
  }

  # SEED-GRANULAR RESUME. Full note in tts-cast-pool.yaml.
  if [ "$SUBSAMPLE_POOL" -gt 1 ]; then
    export TTS_RESUME_SEEDS=0
  else
    export TTS_RESUME_SEEDS="${TTS_RESUME_SEEDS:-1}"
  fi


  run_unit () {                      # $1 = target__tag unit name
    local U="$1" TGT="${1%%__*}" TAG="${1##*__}"
    # PARSE MODE FROM THE SPEC, do not inherit it. The spec file holds the whole "TAG|MODE|SETS"
    # arm string, and keeping only SETS would leave any later reference to $MODE reading whatever
    # the arm-list loop left in the global, which is the wrong arm's mode for every unit but the
    # last. The stock control depends on MODE being right here, because that is what selects the
    # best_of_n config.
    local SPEC; SPEC=$(cat "$PENDING/$U/spec" 2>/dev/null || cat "$CLAIMED/$U/spec")
    local MODE; MODE=${SPEC#*|}; MODE=${MODE%%|*}
    local SETS; SETS=${SPEC#*|}; SETS=${SETS#*|}
    local OUT="$RUN_DIR/${U}"; mkdir -p "$OUT"
    local SRC="$OUT/src"; mkdir -p "$SRC"; cp "$INPUTS_WIRED/$TGT.json" "$SRC/"
    # PER-ARM af3_red history. Full note in tts-cast-pool.yaml.
    export PROTENIX_AF3RED_HIST_DIR="$RUN_DIR/_af3red_hist/${U}"
    # a previous GPU-OOM on this unit forces the confidence stack onto host RAM for this attempt
    if [ -f "$FORCE/$U" ]; then
      export PROTENIX_CONF_OFFLOAD_TOKENS=0        # 0 = offload every target regardless of size
      echo "    (retry with forced confidence-offload after a previous GPU OOM)"
    fi
    rm -f "$MG_FLAG" 2>/dev/null      # set only if the memguard kills this unit
    echo "----- worker $WORKER_ID: $U $(date -u) -----"
    local t0; t0=$(date +%s)
    # The config declares the FAMILY, so it must match the arm's algorithm or run_ablation rejects
    # it, or run_ablation rejects the arm. Derive it from the arm rather than hardcoding.
    local CFG=experiments/configs/diffusion_side/m2_tds.yaml
    # a stock arm carries NO diffusion_search sets, so it must load the best_of_n config or
    # run_ablation would build a search spec for it and the "control" would stop being one.
    [ "$MODE" = stock ] && CFG=experiments/configs/baseline/b0b.yaml
    case "$SETS" in
      *algorithm=af3_red*) CFG=experiments/configs/diffusion_side/m4_af3red.yaml ;;
    esac
    python -m experiments.scripts.run_ablation \
      --config "$CFG" \
      --set model.run.msa_subsample.source_inputs_dir="$SRC" method.label="${METHOD}_${TAG}" \
            model.seeds=[$SEED0] $SETS $BASE $([ "$MODE" = stock ] || echo "$BASE_SEARCH") \
            paths.inputs_dir="$OUT/inputs" paths.predictions_dir="$OUT/pred" \
            paths.results_dir="$OUT/res" -v > "$OUT/run.log" 2>&1
    local rc=$?
    echo "    wall=$(( $(date +%s) - t0 ))s rc=$rc"
    # health gate: refuse to score a run that failed silently
    python "$STATS_DIR/tts_job_lib.py" health --log "$OUT/run.log" --pred-dir "$OUT/pred" \
           --expect-cifs "$EXP_CIF"
    local ok=$?
    # Match only up to the step count. The old pattern also required "(cumulative mean|dx|=N A)",
    # but the line actually reads "cumulative mean|d|=171.5047 [displace...", so it NEVER matched
    # and this echo printed an empty line for every arm. A silent no-op is the one failure this
    # check exists to catch, so a check that cannot fire is worse than no check.
    echo "    $(grep -aoE 'reward gradient (APPLIED at [0-9]+ steps|NEVER APPLIED)' "$OUT/run.log" | tail -1)"
    echo "    ESS trace: $(grep -aoE 'ESS=[0-9.]+/[0-9]+' "$OUT/run.log" | tail -6 | tr '\n' ' ')"
    [ "$TAG" = ctrl ] && [ "$(grep -ac RESAMPLE "$OUT/run.log")" -gt 0 ] && \
      echo "    !! ctrl resampled: it is NOT a clean control"
    if [ $ok -eq 0 ]; then
      local S CONF SITE JAC
      S=$(python "$STATS_DIR/tts_job_lib.py" pool-stats --cdr-map "$PROTENIX_CDR_MAP" \
             --target "$TGT" --pred-dir "$OUT/pred")
      # parse each axis BY NAME: a greedy .*div= would silently capture div_jac
      CONF=$(echo "$S" | grep -oE 'div_conf=[0-9.]+' | head -1 | cut -d= -f2)
      SITE=$(echo "$S" | grep -oE 'div_site=[0-9.]+|div_site=NA' | head -1 | cut -d= -f2)
      JAC=$(echo "$S"  | grep -oE 'div_jac=[0-9.]+|div_jac=NA'  | head -1 | cut -d= -f2)
      # DISTORTION GATE, against a FIXED 7.88 A ceiling. Full note in tts-cast-pool.yaml.
      awk -v d="${CONF:-0}" -v u="$U" 'BEGIN{
        lim = 7.88;
        if (d>lim) printf "    !! DISTORTED %s: div_conf=%.2f over %.2f (natural pairwise max)\n", u, d, lim;
        else if (d>0) printf "    OK: div_conf=%.2f within %.2f (natural pairwise max)\n", d, lim }'
      [ -n "$CONF" ] && echo "$TGT $TAG $CONF ${SITE:-NA} ${JAC:-NA}" >> "$RUN_DIR/rows.txt"
    else
      echo "    !! $U failed the health gate, NOT scored"
    fi
    grep -q "^$TGT $TAG " "$RUN_DIR/rows.txt" 2>/dev/null || \
      echo "    !! $U produced NO ROW -- scoring failed, this arm will be invisible in RESULT.txt"
    return $ok
  }

  score_unit () {                    # $1 = unit output dir; runs under the SCORING venv
    local O="$1"
    # A MISSING parquet is NOT "already scored". Full note in tts-cast-pool.yaml.
    if [ ! -f "$O/res/per_sample.parquet" ]; then
      echo "    !! $(basename "$O"): NO per_sample.parquet -- the verifier stage never ran or its"
      echo "    !! output was removed. --from-per-sample cannot rebuild it; the unit must be re-run."
      return 1
    fi
    # SKIP ONLY A FULLY-SCORED UNIT (.all(), not .any()). Full note in tts-cast-pool.yaml.
    "$SCORE_PY" -c "
  import pandas as pd,sys
  d=pd.read_parquet('$O/res/per_sample.parquet')
  sys.exit(0 if d['dockq'].notna().all() else 1)" 2>/dev/null && return 0
    # NICE, so scoring can never delay the GPU. Full note in tts-cast-pool.yaml.
    timeout 3600 nice -n 19 ionice -c 3 "$SCORE_PY" -m experiments.scripts.evaluate \
      --from-per-sample --target-index "$GT_INDEX" \
      --results-dir "$O/res" --backend "$SCORE_BACKEND" \
      --metrics dockq --dockq-bin "$SCORE_DOCKQ" \
      --method-label inflight > "$O/score.log" 2>&1 \
      && echo "    [scored] $(basename "$O")" || echo "    !! scoring failed for $(basename "$O")"
  }

  # TRACK SCORER PIDs EXPLICITLY. Full note in tts-cast-pool.yaml.
  SCORERS=""
  _reap () { local live="" p; for p in $SCORERS; do kill -0 "$p" 2>/dev/null && live="$live $p"; done; SCORERS="$live"; }
  _n_scorers () { _reap; set -- $SCORERS; echo $#; }
  _wait_scorers () { _reap; local p; for p in $SCORERS; do wait "$p" 2>/dev/null; done; SCORERS=""; }


  # HOST-RAM WATCHDOG. Full note in tts-cast-pool.yaml.
  MEMGUARD_PCT="${MEMGUARD_PCT:-92}"
  MG_FLAG=/tmp/.memguard_fired      # pod-local: set on a memguard kill so the OOM classifier can tell
                                    # a RAM-OOM (offload would NOT help) from a GPU-OOM (escalate)
  ( while true; do
      cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo 0)
      max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
      # SUBTRACT RECLAIMABLE PAGE CACHE. Full note in tts-cast-pool.yaml.
      inact=$(awk '/^inactive_file /{print $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo 0)
      cur=$(( cur > inact ? cur - inact : 0 ))
      case "$max" in ''|max|0) sleep 5; continue;; esac
      pct=$(( cur * 100 / max ))
      if [ "$pct" -ge "$MEMGUARD_PCT" ]; then
        echo "[memguard] host RAM ${pct}% >= ${MEMGUARD_PCT}% of limit -> killing run_ablation to avert a pod OOM-kill $(date -u)"
        touch "$MG_FLAG"
          # KILL THE TREE, NOT JUST THE PARENT. Full note in tts-cast-pool.yaml.
          for _p in $(pgrep -f "[r]un_ablation" 2>/dev/null); do
            for _c in $(pgrep -P "$_p" 2>/dev/null); do
              for _g in $(pgrep -P "$_c" 2>/dev/null); do kill -9 "$_g" 2>/dev/null; done
              kill -9 "$_c" 2>/dev/null
            done
            kill -9 "$_p" 2>/dev/null
          done
          # Belt and braces: a backend process only ever exists under a live run_ablation, so once
          # none is left, anything still running is an orphan whatever its parent now reads as.
          sleep 2
          if ! pgrep -f "[r]un_ablation" >/dev/null 2>&1; then
            for _o in $(pgrep -f "[_]opendde_launch|[t]orch.distributed.run|runner[.]inference" 2>/dev/null); do
              kill -9 "$_o" 2>/dev/null
            done
          fi
          sleep 15
      fi
      sleep 3
    done ) &
    MG_PID=$!   # MUST be tracked. The memguard loop above is UNBOUNDED, so a worker that has
                # drained its queue still has a live child and never exits: it sits at 0% GPU
                # holding the card until the job deadline.

  # ---- drain the queue ---- (full note in tts-cast-pool.yaml)
  RECLAIM_MIN="${RECLAIM_MIN:-90}"
  # Liveness (heartbeat rewritten every 60s) is knowable in minutes. RECLAIM_MIN stays conservative
  # because a false reclaim is destructive, while a false "peer is alive" only defers an orphan.
  HB_FRESH_MIN="${HB_FRESH_MIN:-5}"               # heartbeat younger than this => the claim has a live owner
  DRAIN_IDLE_SEC="${DRAIN_IDLE_SEC:-900}"         # stop camping on a GPU after this long with nothing to do
  reclaim () {
    for C in $(ls "$CLAIMED" 2>/dev/null); do
      [ -d "$CLAIMED/$C" ] || continue
      # heartbeat is refreshed every 60s by the owning worker, so its age is true liveness.
      # Fall back to the claim dir when no heartbeat exists (claim made by an older template).
      _live="$HB/$C"; [ -f "$_live" ] || _live="$CLAIMED/$C"
      if [ -z "$(find "$_live" -maxdepth 0 -mmin -"$RECLAIM_MIN" 2>/dev/null)" ]; then
        echo "worker $WORKER_ID: reclaiming orphaned claim $C (idle > ${RECLAIM_MIN}m)"
        mkdir -p "$PENDING/$C"; cp "$CLAIMED/$C/spec" "$PENDING/$C/spec" 2>/dev/null || true
        rm -rf "$CLAIMED/$C"; rm -f "$HB/$C" 2>/dev/null
      fi
    done
  }

  # DEADLINE-AWARE CLAIMING. Full note in tts-cast-pool.yaml.
  T0=$(date -u +%s)
  DEADLINE_S="${DEADLINE_S:-0}"
  UNIT_EST_S="${UNIT_EST_S:-16000}"
  while :; do
    GOT=""
    if [ "$DEADLINE_S" -gt 0 ]; then
      _left=$(( DEADLINE_S - ( $(date -u +%s) - T0 ) ))
      if [ "$_left" -lt "$UNIT_EST_S" ]; then
        echo "worker $WORKER_ID: ${_left}s left of the ${DEADLINE_S}s deadline, under the ${UNIT_EST_S}s"
        echo "worker $WORKER_ID: a unit needs -- exiting cleanly rather than starting one that dies at the wall"
        break
      fi
    fi
    reclaim
    # untried units first, retried ones last (requeue-at-back)
    for U in $( { for u in $(ls "$PENDING" 2>/dev/null); do [ -f "$PENDING/$u/.retry" ] && echo "1 $u" || echo "0 $u"; done; } | sort | awk '{print $2}' ); do
      if mkdir "$CLAIMED/$U" 2>/dev/null; then                 # atomic claim
        cp "$PENDING/$U/spec" "$CLAIMED/$U/spec" 2>/dev/null || true
        rm -rf "$PENDING/$U"; GOT="$U"; unset idle_since; break
      fi
    done
    if [ -z "$GOT" ]; then
      # DO NOT EXIT WHILE ANOTHER WORKER'S CLAIM IS STILL OUTSTANDING. Full note in tts-cast-pool.yaml.
      if [ "$(ls "$CLAIMED" 2>/dev/null | wc -l)" -gt 0 ]; then
        : "${idle_since:=$(date -u +%s)}"
        _all_live=1
        for C in $(ls "$CLAIMED" 2>/dev/null); do
          _live="$HB/$C"; [ -f "$_live" ] || _live="$CLAIMED/$C"
          [ -n "$(find "$_live" -maxdepth 0 -mmin -"$HB_FRESH_MIN" 2>/dev/null)" ] || _all_live=0
        done
        if [ "$_all_live" = "1" ] && [ "$(( $(date -u +%s) - idle_since ))" -ge "$DRAIN_IDLE_SEC" ]; then
          echo "worker $WORKER_ID: idle ${DRAIN_IDLE_SEC}s and all $(ls "$CLAIMED" | wc -l) outstanding claim(s) have heartbeats < ${HB_FRESH_MIN}m old (live owners), releasing the GPU"
        else
          echo "worker $WORKER_ID: pending empty but $(ls "$CLAIMED" | wc -l) claim(s) outstanding, waiting for reclaim"
          sleep 300
          continue
        fi
      fi
      # SWEEP BEFORE EXIT. Full note in tts-cast-pool.yaml.
      swept=0
      for U in $(ls "$DONE" 2>/dev/null); do
        O="$RUN_DIR/$U"
        # A MISSING parquet is the COMMONEST unscored state. A `continue` here would repair only a
        # PARTIALLY filled parquet and silently skip every unit whose scoring never started, so a
        # worker submitted purely to sweep them exits in seconds having scored nothing.
        if [ -f "$O/res/per_sample.parquet" ]; then
        "$SCORE_PY" -c "
  import pandas as pd,sys
  d=pd.read_parquet('$O/res/per_sample.parquet')
  sys.exit(0 if d['dockq'].notna().all() else 1)" 2>/dev/null && continue
        fi
        [ "$SCORE_JOBS" -eq 0 ] && continue   # external scorer owns this unit
        while [ "$(_n_scorers)" -ge "$SCORE_JOBS" ]; do sleep 5; done
        score_unit "$O" & SCORERS="$SCORERS $!"; swept=$((swept+1))
      done
      [ "$swept" -gt 0 ] && { echo "worker $WORKER_ID: sweeping $swept unscored unit(s) before exit"; _wait_scorers; }
      echo "worker $WORKER_ID: queue drained"; break
    fi
    # CHECKPOINT: retire without re-running if the structures already exist. Full note in tts-cast-pool.yaml.
    if ! unit_complete "$GOT" && unit_generated "$GOT"; then
      echo "worker $WORKER_ID: $GOT fully generated but unscored -- scoring only, NOT re-running inference"
      mv "$CLAIMED/$GOT" "$DONE/$GOT" 2>/dev/null || mkdir -p "$DONE/$GOT"
      [ "$SCORE_JOBS" -gt 0 ] && score_unit "$RUN_DIR/$GOT" &
      continue
    fi
    if unit_complete "$GOT"; then
      echo "worker $WORKER_ID: $GOT already complete on disk -- retiring without re-running"
      mv "$CLAIMED/$GOT" "$DONE/$GOT" 2>/dev/null || mkdir -p "$DONE/$GOT"
      # SCORE_JOBS=0 must skip THIS call too. It is the third scoring site (the other two are the
      # inline one and the exit sweep) and it ran unconditionally, so a deferred run still scored
      # in-pod whenever a unit was already complete on disk.
      [ "$SCORE_JOBS" -gt 0 ] && score_unit "$RUN_DIR/$GOT" &
      continue
    fi
    ( while :; do touch "$HB/$GOT" 2>/dev/null; sleep 60; done ) &   # liveness for orphan reclaim
    HB_PID=$!
    mkdir -p "$Q/attempts"
    n=$(cat "$Q/attempts/$GOT" 2>/dev/null || echo 0); n=$((n+1))
    echo "$n" > "$Q/attempts/$GOT"
    touch "$CLAIMED/$GOT" 2>/dev/null || true      # mark the claim live before the long run
    if run_unit "$GOT"; then
      kill $HB_PID 2>/dev/null; rm -f "$HB/$GOT" 2>/dev/null
      mv "$CLAIMED/$GOT" "$DONE/$GOT" 2>/dev/null || mkdir -p "$DONE/$GOT"
      # score this arm IN THE BACKGROUND. Full note in tts-cast-pool.yaml.
      if [ "$SCORE_JOBS" -gt 0 ]; then
        while [ "$(_n_scorers)" -ge "$SCORE_JOBS" ]; do sleep 5; done
        score_unit "$RUN_DIR/$GOT" & SCORERS="$SCORERS $!"
      fi
    elif [ "$n" -ge "$MAX_ATTEMPTS" ]; then
      # dead-letter: a permanently failing arm must not restart-loop and starve the pool
      kill $HB_PID 2>/dev/null; rm -f "$HB/$GOT" 2>/dev/null   # or its heartbeat outlives the unit
      echo "worker $WORKER_ID: $GOT dead-lettered after $n attempts"
      mv "$CLAIMED/$GOT" "$FAILED/$GOT" 2>/dev/null || mkdir -p "$FAILED/$GOT"
    else
      # ESCALATE a GPU-OOM retry to forced confidence-offload. Full note in tts-cast-pool.yaml.

      kill $HB_PID 2>/dev/null; rm -f "$HB/$GOT" 2>/dev/null
      echo "worker $WORKER_ID: $GOT failed (attempt $n), returning to pending"
      mkdir -p "$PENDING/$GOT"; cp "$CLAIMED/$GOT/spec" "$PENDING/$GOT/spec" 2>/dev/null || true
      touch "$PENDING/$GOT/.retry"      # sorted last by the claim loop, so it goes to the BACK
      rm -rf "$CLAIMED/$GOT"
    fi
  done

  # ---- ground-truth metrics are already done ---- (full note in tts-cast-pool.yaml)
  if [ "$WORKER_ID" = "0" ]; then
    sort "$RUN_DIR/rows.txt" 2>/dev/null | tee "$RUN_DIR/RESULT.txt"
  fi
  # a worker that exits mid-scoring would leave that arm unscored until someone re-runs a backfill
  echo "worker $WORKER_ID: waiting for $(_n_scorers) in-flight scorer(s)"
  _wait_scorers
  # ${HB_PID:-}, not $HB_PID: HB_PID is only set once a unit has been CLAIMED, so a worker that
  # found every unit already claimed reaches here having never set it, and under `set -u` the
  # bare expansion aborts. That turned a correct, clean exit (nothing left to do, GPU released)
  # into a Failed job, indistinguishable from a real crash to any monitor.
  kill ${HB_PID:-} 2>/dev/null                  # belt and braces: nothing may outlive the worker
      kill "${MG_PID:-0}" 2>/dev/null || true       # stop the unbounded memguard, or the worker hangs here
  echo "worker $WORKER_ID exit $(date -u): done=$(ls "$DONE" | wc -l) failed=$(ls "$FAILED" | wc -l)"

# ---- cluster wiring (fill in for your cluster; values below are PLACEHOLDERS) ----
job_name: tts-steer-pool

resourcing:
  cpu: 8                 # REQUEST 8 per 1 GPU, with the limit at 12 below. `requests` is a
                         # scheduling RESERVATION, `limits` is the throughput cap. Inference bursts
                         # to about 11 cores and the limit of 12 already covers that, so raising the
                         # REQUEST buys no speed. It only reserves more of the queue flavour's
                         # bundled CPU, which is bundled per GPU, so a bigger request consumes CPU
                         # other users need to admit their own GPU jobs.
  memory: 64Gi           # peak host RSS is 9.2 GiB at the worst case (1155 tokens, 50 samples,
                         # confidence chunk 5, CPU-offload active), and host RAM is FLAT in sample
                         # count once the confidence stage is chunked, so TOKEN count is what moves
                         # it. This is ~7x that peak for a 1-GPU pod and ~1.7x for a 4-GPU one, one
                         # inference per GPU. Above 128 samples the offload rail fires and the
                         # retained-sample stack grows, so raise it for such a pool.
  nvidia.com/gpu: 1      # ONE GPU per worker; parallelism = how many workers you submit

# PIN THE GPU MODEL. Full note in tts-cast-pool.yaml.
node_selector: '<YOUR-GPU-PRODUCT-LABEL>'    # e.g. nvidia.com/gpu.product: <A100-80GB product name>
tolerations: []                              # add the taint your large-GPU nodes carry, if any

namespace: '<YOUR-NAMESPACE>'
image: '<YOUR-PROTENIX-IMAGE>'

additional_volumes:
  - name: work
    mount_path: /workspace
    claim_name: '<YOUR-PVC-CLAIM>'
    read_only: False

git_repo: null
git_commit: null
